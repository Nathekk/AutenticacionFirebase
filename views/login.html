<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
<div class="card-body">
    <h2 class="text-center mb-4">Iniciar sesión</h2>

    <form id="formLogin">
        <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" id="email" class="form-control" placeholder="Introduce tu correo" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-control" placeholder="Introduce tu contraseña" required>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary">
                Iniciar sesión
            </button>
        </div>
    </form>

    <div id="mensaje" class="mt-3"></div>
    <hr>

    <p class="text-center mb-0">
        <a href="/register">Regístrate</a>
    </p>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js'
    import {getAuth, signInWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC3W4cTYgKShztej1y05MhG7xs27YbVS84",
        authDomain: "autenticacion-82296.firebaseapp.com",
        projectId: "autenticacion-82296",
        storageBucket: "autenticacion-82296.firebasestorage.app",
        messagingSenderId: "919005031794",
        appId: "1:919005031794:web:4715036f8b11274626c1eb"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const mensajeDiv = document.getElementById('mensaje');

        signInWithEmailAndPassword(auth, email, password)
            .then((userCredential) => {
                mensajeDiv.innerHTML = `<div class="alert alert-success">¡Inicio de sesión exitoso! Redirigiendo...</div>`;
                setTimeout(() => {
                    window.location.href = "/home";
                }, 1500);
            })
            .catch((error) => {
                mensajeDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
